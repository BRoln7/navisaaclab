name: NavIsaacLab CPU regressions
on:
  workflow_dispatch:
jobs:
  amp-core:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: exts/socnav_sim
      PYTHONDONTWRITEBYTECODE: '1'
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.7.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install stable-baselines3==2.9.0 gymnasium==1.2.1 PyYAML==6.0.2 pytest==9.1.1
      - run: python -m pip install -r requirements-mimickit-amp.txt
      - run: python scripts/mimickit_amp/fetch.py
      - run: python -m pytest tests -q
