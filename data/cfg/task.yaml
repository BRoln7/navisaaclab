# config.yaml

# pacer
training:
  train: True
  checkpoint: null
  # checkpoint: 'logs/sb3/Isaac-Pacer/pacer1.85/model_310272000_steps.zip'
  lr: !!float 2e-5
  disc_coef: 5
  bound_loss: 10
  data_file: 'motion_cap/amass_isaac_run_upright_slim.pkl'
