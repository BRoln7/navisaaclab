# Default public navigation example. Use cadrl_scene35.yaml for scene 35.
training:
  train: false
  checkpoint: null

env:
  task: Isaac-Cadrl-Scene27
  method: Cadrl
  num_envs: 16
  num_robots: 4
  pedestrian_speed: 0.85
  pedestrian_speed_variation: 0.15
  fast_pedestrian_probability: 0.10
  fast_pedestrian_speed: 1.20
  fast_pedestrian_speed_variation: 0.15
  pedestrian_acceleration_max: 2.0
  pedestrian_turn_rate_max: 2.0
  map_dilation: 7
  pedestrian_policy: data/checkpoints/policy.pth
  debug_vis: true
  log_name: cadrl-scene27
