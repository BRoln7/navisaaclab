# config.yaml

# pacer
training:
  train: True
  checkpoint: null
  # checkpoint: 'logs/sb3/Isaac-Pacer/pacer1.10/model_202752000_steps.zip'
  lr: !!float 2e-5
  disc_coef: 5
  bound_loss: 10
  data_file: 'motion_cap/amass_isaac_run_upright_slim.pkl'
  # data_file: 'motion_cap/amass_isaac_standing_upright_slim.pkl'
env:
  num_envs: 4096
  num_robots: 10 # there is a bug for config init, this is not useful for pacer-task
  task: Isaac-Pacer
  log_name: pacer4.00
  traj_speed: 4.00
  amp_dt: !!float 0.03333333333333 # 1 / 30

