# All unspecified settings come from MimicKit's official SMPL AMP environment.
base: third_party/MimicKit/data/envs/amp_smpl_env.yaml
char_file: third_party/MimicKit/data/assets/smpl/smpl.xml
# Rebuilt PACER subset, native SMPL conversion, uniform per-clip weights.
motion_file: data/mimickit/amass-pacer-v1/native/motions.yaml
# Episode length (10 s), global_obs (true), history and all other character
# settings inherit the upstream SMPL preset. Tracking is an explicit extension.
tracking:
  enabled: false
  # PACER pacer_no_shape.yaml and HumanoidTraj defaults (commit baeb624).
  reward_weight: 0.5
  style_reward_weight: 0.5
  num_vertices: 101
  heading_change_max: 2.0
  observation_samples: 10
  observation_timestep: 0.5
  speed_min: 0.0
  speed_max: 3.0
  acceleration_max: 2.0
  sharp_turn_probability: 0.02
  position_scale: 2.0
  max_distance: 4.0
  # Pure AMP has no power term. Disable PACER's optional energy regularizer
  # while validating trajectory transfer because Isaac Lab only exposes the
  # implicit-PD torque estimate, not Isaac Gym's DOF-force sensor value.
  # Raw mechanical power remains logged for a later calibrated ablation.
  power_coefficient: 0.0
