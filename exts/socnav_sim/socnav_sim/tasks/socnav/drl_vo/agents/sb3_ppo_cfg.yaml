# Reference: https://github.com/DLR-RM/rl-baselines3-zoo/blob/master/hyperparams/ppo.yml#L245
seed: 0

# The 3x80x80 input and 2D subgoal are flattened into one vector. CustomCNN
# performs the split; MlpPolicy supports this vector observation space.
policy: 'MlpPolicy'
n_timesteps: !!float 5e6
batch_size: 128
n_steps: 128
gamma: 0.99
learning_rate: !!float 5e-5
ent_coef: 0.0
clip_range: 0.2
n_epochs: 10
gae_lambda: 0.95
max_grad_norm: 1.0
vf_coef: 5
device: "cuda:0"
